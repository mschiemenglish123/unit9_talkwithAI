<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My English Friend - Unit 9 Colours</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            min-height: 100vh;
            color: #333;
            overflow-x: hidden;
        }

        .bot-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 1);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        .teacher-panel {
            background: #2d3748;
            color: white;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.2);
        }

        .speech-bubble {
            position: relative;
            background: #ffffff;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 3px solid #ffb7b2;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            left: -15px;
            top: 50%;
            transform: translateY(-50%);
            border-width: 15px 15px 15px 0;
            border-style: solid;
            border-color: transparent #ffb7b2 transparent transparent;
            display: block;
            width: 0;
        }

        .speech-bubble::before {
            content: '';
            position: absolute;
            left: -11px;
            top: 50%;
            transform: translateY(-50%);
            border-width: 12px 12px 12px 0;
            border-style: solid;
            border-color: transparent #ffffff transparent transparent;
            display: block;
            width: 0;
            z-index: 1;
        }

        @media (max-width: 768px) {
            .speech-bubble::after, .speech-bubble::before {
                top: -15px;
                left: 50%;
                transform: translateX(-50%);
                border-width: 0 15px 15px 15px;
                border-color: transparent transparent #ffb7b2 transparent;
            }
            .speech-bubble::before {
                top: -11px;
                border-color: transparent transparent #ffffff transparent;
            }
        }

        .btn-game {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-game:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        .btn-game:active {
            transform: translateY(1px);
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bouncing {
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- Main Content Area -->
    <div class="flex-grow flex flex-col items-center p-4 sm:p-8 overflow-y-auto pb-64">
        
        <!-- Header -->
        <header class="text-center mb-8 w-full max-w-4xl">
            <h1 class="text-4xl md:text-5xl font-black text-blue-700 drop-shadow-md tracking-wide">
                🤖 MY ENGLISH FRIEND
            </h1>
            <p class="text-xl text-blue-900 font-bold mt-2">Unit 9: Colours</p>
        </header>

        <!-- Initial Screen / Level Selection -->
        <div id="start-screen" class="glass-panel rounded-3xl p-8 w-full max-w-3xl text-center fade-in">
            <h2 class="text-2xl font-bold mb-6 text-gray-800">Hello! I'm your English friend. What do you want to learn today?</h2>
            
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-6">
                <button onclick="startGame(1)" class="btn-game bg-green-400 hover:bg-green-500 text-white font-bold py-6 px-4 rounded-2xl text-xl border-b-4 border-green-600">
                    LEVEL 1 <br><span class="text-sm font-normal">Easy: Look and Say</span>
                </button>
                <button onclick="startGame(2)" class="btn-game bg-yellow-400 hover:bg-yellow-500 text-white font-bold py-6 px-4 rounded-2xl text-xl border-b-4 border-yellow-600">
                    LEVEL 2 <br><span class="text-sm font-normal">Medium: Listen & Answer</span>
                </button>
                <button onclick="startGame(3)" class="btn-game bg-pink-400 hover:bg-pink-500 text-white font-bold py-6 px-4 rounded-2xl text-xl border-b-4 border-pink-600">
                    LEVEL 3 <br><span class="text-sm font-normal">Challenge: Let's Talk!</span>
                </button>
            </div>
            <button onclick="startGame('all')" class="btn-game w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 px-4 rounded-2xl text-lg border-b-4 border-blue-700">
                Play All Levels Mix
            </button>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="hidden w-full max-w-5xl fade-in flex flex-col md:flex-row gap-6 items-center md:items-stretch">
            
            <!-- Chatbot AI Column -->
            <div class="w-full md:w-1/3 flex flex-col items-center justify-center">
                <!-- Mascot SVG -->
                <div class="w-48 h-48 mb-4 bouncing relative">
                    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="w-full h-full drop-shadow-xl">
                        <!-- Head -->
                        <rect x="40" y="50" width="120" height="100" rx="30" fill="#4facfe" />
                        <!-- Ears -->
                        <rect x="20" y="80" width="30" height="40" rx="10" fill="#ff758c" />
                        <rect x="150" y="80" width="30" height="40" rx="10" fill="#ff758c" />
                        <!-- Antenna -->
                        <rect x="95" y="10" width="10" height="40" fill="#a1c4fd" />
                        <circle cx="100" cy="15" r="15" fill="#f6d365" />
                        <!-- Face Screen -->
                        <rect x="55" y="70" width="90" height="60" rx="15" fill="#ffffff" />
                        <!-- Eyes -->
                        <circle cx="75" cy="95" r="12" fill="#333" class="eye" />
                        <circle cx="125" cy="95" r="12" fill="#333" class="eye" />
                        <circle cx="78" cy="92" r="4" fill="#fff" />
                        <circle cx="128" cy="92" r="4" fill="#fff" />
                        <!-- Smile -->
                        <path d="M 80 115 Q 100 125 120 115" stroke="#ff758c" stroke-width="5" fill="transparent" stroke-linecap="round"/>
                    </svg>
                </div>
            </div>

            <!-- Content & Speech Column -->
            <div class="w-full md:w-2/3 flex flex-col justify-center">
                <!-- Speech Bubble -->
                <div class="speech-bubble mb-6 min-h-[100px] flex items-center justify-center text-center">
                    <p id="bot-message" class="text-2xl font-bold text-gray-700 w-full"></p>
                </div>
                
                <!-- Visual Display Area -->
                <div class="glass-panel rounded-3xl p-8 min-h-[250px] flex flex-col items-center justify-center relative">
                    <!-- Situation Context Text (if any) -->
                    <div id="context-badge" class="hidden absolute top-4 left-4 bg-yellow-300 text-yellow-800 font-bold px-4 py-1 rounded-full text-sm shadow"></div>
                    
                    <!-- Images Container -->
                    <div id="image-container" class="flex flex-wrap justify-center gap-6 items-center">
                        <!-- SVGs injected here via JS -->
                    </div>
                </div>
            </div>

        </div>

    </div>

    <!-- TEACHER DASHBOARD (Fixed Bottom) -->
    <div class="fixed bottom-0 left-0 w-full teacher-panel p-4 z-50">
        <div class="max-w-6xl mx-auto">
            <!-- Top bar: Stats & Info -->
            <div class="flex justify-between items-center mb-3 border-b border-gray-600 pb-2">
                <div class="text-sm md:text-base font-bold text-yellow-300 uppercase tracking-wider flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                    TEACHER DASHBOARD
                </div>
                <div class="flex gap-4 text-sm font-semibold">
                    <span id="level-indicator" class="bg-gray-700 px-3 py-1 rounded-full">Level: -</span>
                    <span class="bg-blue-600 px-3 py-1 rounded-full">Progress: <span id="progress-text">0/0</span></span>
                    <span class="bg-green-600 px-3 py-1 rounded-full">Correct: <span id="correct-text">0</span></span>
                </div>
            </div>

            <!-- Controls Row -->
            <div class="grid grid-cols-2 md:flex md:flex-row gap-3 justify-between items-center">
                
                <!-- Group 1: General Flow -->
                <div class="flex flex-wrap gap-2 col-span-2 md:col-span-1 justify-center md:justify-start">
                    <button onclick="resetToMenu()" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg font-semibold transition shadow-md flex items-center gap-2">
                        🏠 Home
                    </button>
                    <button onclick="readQuestion()" class="bg-indigo-500 hover:bg-indigo-600 px-4 py-2 rounded-lg font-semibold transition shadow-md flex items-center gap-2">
                        🔊 Listen
                    </button>
                    <button onclick="shuffleQuestions()" class="bg-gray-600 hover:bg-gray-500 px-4 py-2 rounded-lg font-semibold transition shadow-md">
                        🔀 Shuffle
                    </button>
                </div>

                <!-- Group 2: Assessment (Core) -->
                <div class="flex flex-wrap gap-2 col-span-2 md:col-span-1 justify-center">
                    <button onclick="markCorrect()" id="btn-correct" class="bg-green-500 hover:bg-green-400 text-white px-6 py-2 rounded-lg font-bold transition shadow-md border-b-4 border-green-700 text-lg disabled:opacity-50">
                        ✅ Correct
                    </button>
                    <button onclick="giveHint()" id="btn-hint" class="bg-yellow-500 hover:bg-yellow-400 text-gray-900 px-6 py-2 rounded-lg font-bold transition shadow-md border-b-4 border-yellow-700 text-lg disabled:opacity-50">
                        💡 Hint / Try Again
                    </button>
                </div>

                <!-- Group 3: Navigation -->
                <div class="flex flex-wrap gap-2 col-span-2 md:col-span-1 justify-center md:justify-end items-center">
                    <button onclick="toggleAnswer()" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg text-sm transition text-gray-300">
                        👁️ Target Answer
                    </button>
                    <button onclick="skipQuestion()" class="bg-orange-500 hover:bg-orange-400 px-4 py-2 rounded-lg font-semibold transition shadow-md">
                        ⏭️ Skip
                    </button>
                    <button onclick="nextQuestion()" id="btn-next" class="bg-blue-500 hover:bg-blue-400 px-6 py-2 rounded-lg font-bold transition shadow-md border-b-4 border-blue-700 opacity-50 cursor-not-allowed" disabled>
                        Next ➡️
                    </button>
                </div>

            </div>
            
            <!-- Target Answer Display -->
            <div id="target-answer-box" class="hidden mt-3 bg-gray-800 p-2 rounded text-center text-green-300 font-mono text-sm border border-gray-600">
                Target: <span id="target-answer-text"></span>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        // --- 1. DATA STRUCTURE ---
        const allQuestions = [
            // LEVEL 1: EASY (Singular)
            { id: 1, level: 1, type: "singular", object: "eraser", color: "blue", q: "What colour is it?", a: "It's blue.", hint: "Look! Is it blue or red? Start with 'It's...'" },
            { id: 2, level: 1, type: "singular", object: "ruler", color: "brown", q: "What colour is it?", a: "It's brown.", hint: "Look! Is it brown or green? Say 'It's...'" },
            { id: 3, level: 1, type: "singular", object: "pen", color: "red", q: "What colour is it?", a: "It's red.", hint: "Is it red or black? Start with 'It's...'" },
            { id: 4, level: 1, type: "singular", object: "pencil", color: "yellow", q: "What colour is it?", a: "It's yellow.", hint: "Is it yellow or orange? Say 'It's...'" },
            { id: 5, level: 1, type: "singular", object: "book", color: "orange", q: "What colour is it?", a: "It's orange.", hint: "Is it orange or yellow? Say 'It's...'" },
            
            // LEVEL 2: MEDIUM (Plural)
            { id: 6, level: 2, type: "plural", object: "book", color: "orange", count: 2, q: "What colour are they?", a: "They're orange.", hint: "There are two books. Start with 'They're...'" },
            { id: 7, level: 2, type: "plural", object: "notebook", color: "green", count: 3, q: "What colour are they?", a: "They're green.", hint: "Start with 'They're... green'." },
            { id: 8, level: 2, type: "plural", object: "eraser", color: "white", count: 2, q: "What colour are they?", a: "They're white.", hint: "Are they black or white? Say 'They're...'" },
            { id: 9, level: 2, type: "plural", object: "school bag", color: "black", count: 2, q: "What colour are they?", a: "They're black.", hint: "Say 'They're black'." },
            { id: 10, level: 2, type: "plural", object: "pen", color: "blue", count: 4, q: "What colour are they?", a: "They're blue.", hint: "Use the word 'They're...' for many pens." },
            
            // LEVEL 3: CHALLENGE (Scenarios)
            { id: 11, level: 3, type: "scenario", context: "My pencil case", object: "pencil case", color: "blue", q: "Look at my pencil case. What colour is it?", a: "It's blue.", hint: "It is one thing. Say 'It's blue'." },
            { id: 12, level: 3, type: "scenario", context: "My school things", object: "ruler", color: "brown", count: 2, q: "I have two rulers. What colour are they?", a: "They're brown.", hint: "I have two! So start with 'They're...'" },
            { id: 13, level: 3, type: "scenario", context: "In my classroom", object: "school bag", color: "black", count: 2, q: "Look at those school bags! What colour are they?", a: "They're black.", hint: "Say 'They're black'." },
            { id: 14, level: 3, type: "reverse", context: "Be the teacher!", object: "pencil", color: "yellow", q: "You are the teacher! Ask me about this pencil.", a: "What colour is it?", hint: "Ask the question: 'What colour... ?'" },
            { id: 15, level: 3, type: "reverse", context: "Ask your friend!", object: "eraser", color: "white", count: 3, q: "Ask me about these erasers!", a: "What colour are they?", hint: "There are three erasers. Ask: 'What colour are... ?'" }
        ];

        // --- 2. STATE ---
        let currentQuestions = [];
        let currentIndex = 0;
        let correctCount = 0;
        let isGameActive = false;
        let showingAnswer = false;

        // --- 3. DOM ELEMENTS ---
        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const botMessage = document.getElementById('bot-message');
        const imageContainer = document.getElementById('image-container');
        const contextBadge = document.getElementById('context-badge');
        
        // Dashboard Elements
        const levelIndicator = document.getElementById('level-indicator');
        const progressText = document.getElementById('progress-text');
        const correctText = document.getElementById('correct-text');
        const targetAnswerBox = document.getElementById('target-answer-box');
        const targetAnswerText = document.getElementById('target-answer-text');
        const btnCorrect = document.getElementById('btn-correct');
        const btnHint = document.getElementById('btn-hint');
        const btnNext = document.getElementById('btn-next');

        // Praise Arrays
        const praiseWords = ["Excellent!", "Great job!", "Well done!", "Fantastic!", "Perfect!", "You are amazing!"];

        // --- 4. CORE FUNCTIONS ---

        function startGame(level) {
            if (level === 'all') {
                currentQuestions = [...allQuestions];
                levelIndicator.innerText = "Level: ALL";
            } else {
                currentQuestions = allQuestions.filter(q => q.level === level);
                levelIndicator.innerText = "Level: " + level;
            }
            
            shuffleArray(currentQuestions);
            currentIndex = 0;
            correctCount = 0;
            isGameActive = true;
            
            startScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            
            updateDashboardStats();
            renderCurrentQuestion();
        }

        function resetToMenu() {
            isGameActive = false;
            startScreen.classList.remove('hidden');
            gameScreen.classList.add('hidden');
            speechSynthesis.cancel(); // Stop talking
        }

        function shuffleQuestions() {
            if(!isGameActive) return;
            // Shuffle remaining questions
            const remaining = currentQuestions.slice(currentIndex);
            shuffleArray(remaining);
            currentQuestions.splice(currentIndex, remaining.length, ...remaining);
            renderCurrentQuestion();
        }

        function renderCurrentQuestion() {
            if (currentIndex >= currentQuestions.length) {
                endGame();
                return;
            }

            const q = currentQuestions[currentIndex];
            
            // 1. Update text
            botMessage.innerText = q.q;
            targetAnswerText.innerText = q.a;
            
            // 2. Context Badge
            if (q.context) {
                contextBadge.innerText = q.context;
                contextBadge.classList.remove('hidden');
            } else {
                contextBadge.classList.add('hidden');
            }

            // 3. Render Images
            imageContainer.innerHTML = '';
            let count = q.count || 1;
            for(let i=0; i<count; i++) {
                const svgString = getObjectSVG(q.object, q.color);
                const div = document.createElement('div');
                div.className = "w-32 h-32 md:w-40 md:h-40 transform hover:scale-110 transition duration-300 drop-shadow-xl";
                div.innerHTML = svgString;
                imageContainer.appendChild(div);
            }

            // 4. Reset Teacher Buttons
            btnCorrect.disabled = false;
            btnHint.disabled = false;
            btnCorrect.classList.remove('opacity-50', 'cursor-not-allowed');
            btnHint.classList.remove('opacity-50', 'cursor-not-allowed');
            
            btnNext.disabled = true;
            btnNext.classList.add('opacity-50', 'cursor-not-allowed');

            updateDashboardStats();
            readQuestion();
        }

        function markCorrect() {
            if(!isGameActive) return;
            correctCount++;
            
            // Random praise
            const praise = praiseWords[Math.floor(Math.random() * praiseWords.length)];
            botMessage.innerText = praise;
            speakText(praise);

            // Disable correct/hint, enable next
            btnCorrect.disabled = true;
            btnHint.disabled = true;
            btnCorrect.classList.add('opacity-50', 'cursor-not-allowed');
            btnHint.classList.add('opacity-50', 'cursor-not-allowed');
            
            btnNext.disabled = false;
            btnNext.classList.remove('opacity-50', 'cursor-not-allowed');
            
            updateDashboardStats();
        }

        function giveHint() {
            if(!isGameActive) return;
            const q = currentQuestions[currentIndex];
            const text = "Good try! Let's try again. " + q.hint;
            botMessage.innerText = text;
            speakText(text);
        }

        function nextQuestion() {
            if(!isGameActive) return;
            currentIndex++;
            renderCurrentQuestion();
        }

        function skipQuestion() {
            if(!isGameActive) return;
            currentIndex++;
            renderCurrentQuestion();
        }

        function toggleAnswer() {
            showingAnswer = !showingAnswer;
            if(showingAnswer) {
                targetAnswerBox.classList.remove('hidden');
            } else {
                targetAnswerBox.classList.add('hidden');
            }
        }

        function updateDashboardStats() {
            progressText.innerText = `${currentIndex + 1} / ${currentQuestions.length}`;
            if(currentIndex >= currentQuestions.length) {
                progressText.innerText = `${currentQuestions.length} / ${currentQuestions.length}`;
            }
            correctText.innerText = correctCount;
        }

        function endGame() {
            botMessage.innerText = `Awesome! We finished! You got ${correctCount} correct!`;
            speakText(`Awesome! We finished! You got ${correctCount} correct!`);
            imageContainer.innerHTML = `
                <div class="text-6xl animate-bounce text-center w-full">🎉🎓✨</div>
                <div class="text-2xl font-bold text-blue-700 w-full text-center mt-4">Great Job!</div>
            `;
            contextBadge.classList.add('hidden');
            
            btnCorrect.disabled = true;
            btnHint.disabled = true;
            btnNext.disabled = true;
            btnCorrect.classList.add('opacity-50', 'cursor-not-allowed');
            btnHint.classList.add('opacity-50', 'cursor-not-allowed');
        }

        // --- 5. UTILS ---

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // --- 6. TEXT TO SPEECH ---
        function readQuestion() {
            if(!isGameActive) return;
            const q = currentQuestions[currentIndex];
            // If the bot message was changed by hint/correct, revert to question first, unless it's a praise/hint state.
            // Best is just to read whatever is currently in botMessage.
            speakText(botMessage.innerText);
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            
            speechSynthesis.cancel(); // stop current speaking
            const utterance = new SpeechSynthesisUtterance(text);
            
            // Try to find a British English voice
            let voices = speechSynthesis.getVoices();
            let ukVoice = voices.find(v => v.lang === 'en-GB' || v.name.includes('UK') || v.name.includes('Great Britain'));
            if (!ukVoice) {
                ukVoice = voices.find(v => v.lang.startsWith('en')); // Fallback to any English
            }
            
            if (ukVoice) utterance.voice = ukVoice;
            utterance.rate = 0.9; // Slightly slower for primary students
            utterance.pitch = 1.1; // Slightly higher pitch for friendliness
            
            speechSynthesis.speak(utterance);
        }

        // Load voices asynchronously in some browsers
        window.speechSynthesis.onvoiceschanged = function() {
            // just to ensure voices are loaded
        };

        // --- 7. SVG GENERATOR ---
        // Generates clean SVG elements for the objects based on color
        function getObjectSVG(objectType, color) {
            const hexColor = getColorHex(color);
            const secondaryColor = darkenColor(hexColor, 30);
            
            switch(objectType) {
                case 'eraser':
                    return `
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
                        <rect x="15" y="35" width="70" height="40" rx="5" fill="${hexColor}" stroke="#333" stroke-width="3"/>
                        <path d="M 15 55 L 85 55" stroke="#333" stroke-width="3"/>
                        <!-- Two tone eraser style -->
                        <path d="M 15 40 Q 15 35 20 35 L 80 35 Q 85 35 85 40 L 85 55 L 15 55 Z" fill="${secondaryColor}" stroke="#333" stroke-width="0"/>
                        <text x="50" y="70" font-size="12" font-family="sans-serif" text-anchor="middle" fill="#333" font-weight="bold">ERASER</text>
                    </svg>`;
                case 'ruler':
                    return `
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="w-full h-full transform -rotate-12">
                        <rect x="10" y="40" width="80" height="20" rx="2" fill="${hexColor}" stroke="#333" stroke-width="2"/>
                        <!-- Ticks -->
                        <line x1="20" y1="40" x2="20" y2="48" stroke="#333" stroke-width="2"/>
                        <line x1="30" y1="40" x2="30" y2="45" stroke="#333" stroke-width="1.5"/>
                        <line x1="40" y1="40" x2="40" y2="48" stroke="#333" stroke-width="2"/>
                        <line x1="50" y1="40" x2="50" y2="45" stroke="#333" stroke-width="1.5"/>
                        <line x1="60" y1="40" x2="60" y2="48" stroke="#333" stroke-width="2"/>
                        <line x1="70" y1="40" x2="70" y2="45" stroke="#333" stroke-width="1.5"/>
                        <line x1="80" y1="40" x2="80" y2="48" stroke="#333" stroke-width="2"/>
                    </svg>`;
                case 'pen':
                    return `
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="w-full h-full transform rotate-45">
                        <!-- Body -->
                        <rect x="35" y="20" width="15" height="50" rx="2" fill="${hexColor}" stroke="#333" stroke-width="2"/>
                        <!-- Cap / Top -->
                        <rect x="35" y="10" width="15" height="10" rx="3" fill="#333" />
                        <!-- Tip -->
                        <polygon points="35,70 50,70 42.5,90" fill="#ddd" stroke="#333" stroke-width="2"/>
                        <!-- Ink tip -->
                        <polygon points="40,84 45,84 42.5,90" fill="${hexColor}"/>
                    </svg>`;
                case 'pencil':
                    return `
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="w-full h-full transform rotate-45">
                        <!-- Body -->
                        <rect x="35" y="25" width="16" height="45" fill="${hexColor}" stroke="#333" stroke-width="2"/>
                        <!-- Lines on body -->
                        <line x1="40" y1="25" x2="40" y2="70" stroke="#333" stroke-width="1"/>
                        <line x1="46" y1="25" x2="46" y2="70" stroke="#333" stroke-width="1"/>
                        <!-- Metal part -->
                        <rect x="35" y="15" width="16" height="10" fill="#aaa" stroke="#333" stroke-width="2"/>
                        <!-- Eraser end -->
                        <rect x="35" y="5" width="16" height="10" rx="3" fill="#ff9999" stroke="#333" stroke-width="2"/>
                        <!-- Wood tip -->
                        <polygon points="35,70 51,70 43,88" fill="#e6c280" stroke="#333" stroke-width="2"/>
                        <!-- Lead tip -->
                        <polygon points="40,82 46,82 43,88" fill="#333"/>
                    </svg>`;
                case 'book':
                    return `
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
                        <!-- Pages -->
                        <path d="M 25 15 L 75 15 A 5 5 0 0 1 80 20 L 80 80 A 5 5 0 0 1 75 85 L 25 85 Z" fill="#fff" stroke="#333" stroke-width="2"/>
                        <!-- Cover -->
                        <path d="M 20 10 L 70 10 A 5 5 0 0 1 75 15 L 75 85 A 5 5 0 0 1 70 90 L 20 90 A 5 5 0 0 1 15 85 L 15 15 A 5 5 0 0 1 20 10 Z" fill="${hexColor}" stroke="#333" stroke-width="3"/>
                        <line x1="25" y1="10" x2="25" y2="90" stroke="#333" stroke-width="2"/>
                        <!-- Title mark -->
                        <rect x="35" y="30" width="25" height="10" fill="#fff" stroke="#333" stroke-width="1.5" rx="2"/>
                        <line x1="35" y1="50" x2="60" y2="50" stroke="#333" stroke-width="2" stroke-linecap="round"/>
                        <line x1="35" y1="60" x2="50" y2="60" stroke="#333" stroke-width="2" stroke-linecap="round"/>
                    </svg>`;
                case 'notebook':
                    return `
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
                        <!-- Cover -->
                        <rect x="25" y="15" width="55" height="70" rx="3" fill="${hexColor}" stroke="#333" stroke-width="3"/>
                        <!-- Spiral binding -->
                        <circle cx="20" cy="25" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
                        <circle cx="20" cy="40" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
                        <circle cx="20" cy="55" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
                        <circle cx="20" cy="70" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
                        <path d="M 16 25 Q 25 15 30 25" stroke="#333" stroke-width="2" fill="none"/>
                        <path d="M 16 40 Q 25 30 30 40" stroke="#333" stroke-width="2" fill="none"/>
                        <path d="M 16 55 Q 25 45 30 55" stroke="#333" stroke-width="2" fill="none"/>
                        <path d="M 16 70 Q 25 60 30 70" stroke="#333" stroke-width="2" fill="none"/>
                        <!-- Label -->
                        <rect x="40" y="35" width="25" height="15" fill="#fff" stroke="#333" stroke-width="1.5"/>
                    </svg>`;
                case 'school bag':
                    return `
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
                        <!-- Handle -->
                        <path d="M 40 30 Q 50 15 60 30" stroke="#333" stroke-width="4" fill="none"/>
                        <!-- Main Body -->
                        <path d="M 25 40 Q 25 25 50 25 Q 75 25 75 40 L 80 80 Q 80 90 50 90 Q 20 90 20 80 Z" fill="${hexColor}" stroke="#333" stroke-width="3"/>
                        <!-- Front Pocket -->
                        <path d="M 30 60 Q 30 55 50 55 Q 70 55 70 60 L 70 85 Q 70 90 50 90 Q 30 90 30 85 Z" fill="${secondaryColor}" stroke="#333" stroke-width="2"/>
                        <!-- Buckles/Straps -->
                        <rect x="35" y="55" width="8" height="20" fill="#333" rx="2"/>
                        <rect x="57" y="55" width="8" height="20" fill="#333" rx="2"/>
                    </svg>`;
                case 'pencil case':
                    return `
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
                        <!-- Body -->
                        <rect x="10" y="35" width="80" height="30" rx="15" fill="${hexColor}" stroke="#333" stroke-width="3"/>
                        <!-- Zipper line -->
                        <line x1="25" y1="50" x2="75" y2="50" stroke="#333" stroke-width="2" stroke-dasharray="2,2"/>
                        <!-- Zipper pull -->
                        <rect x="75" y="47" width="8" height="6" rx="2" fill="#silver" stroke="#333" stroke-width="1"/>
                    </svg>`;
                default:
                    return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="${hexColor}"/></svg>`;
            }
        }

        // Map general colors to nicer hex codes for UI
        function getColorHex(colorName) {
            const colors = {
                blue: "#4facfe",
                brown: "#8b5a2b",
                red: "#ff4d4d",
                yellow: "#f6d365",
                orange: "#ff9a44",
                green: "#43e97b",
                white: "#f8f9fa",
                black: "#343a40"
            };
            return colors[colorName] || "#ccc";
        }

        function darkenColor(hex, amount) {
            // Simple logic for darkening hex color
            let usePound = false;
            if (hex[0] == "#") {
                hex = hex.slice(1);
                usePound = true;
            }
            let num = parseInt(hex, 16);
            let r = (num >> 16) - amount;
            if (r > 255) r = 255; else if (r < 0) r = 0;
            let b = ((num >> 8) & 0x00FF) - amount;
            if (b > 255) b = 255; else if (b < 0) b = 0;
            let g = (num & 0x0000FF) - amount;
            if (g > 255) g = 255; else if (g < 0) g = 0;
            return (usePound ? "#" : "") + (g | (b << 8) | (r << 16)).toString(16).padStart(6, '0');
        }

    </script>
